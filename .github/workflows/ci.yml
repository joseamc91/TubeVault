name: TubeVault CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Show .NET SDK version
        run: dotnet --version

      - name: Restore
        run: dotnet restore .\TubeVault.sln

      - name: Build
        run: dotnet build .\TubeVault.sln -c Release --no-restore

      - name: Publish win-x64
        run: dotnet publish .\src\TubeVault\TubeVault.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\TubeVault-win-x64

      - name: Validate publish output
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\TubeVault-win-x64"
          $executablePath = Join-Path $publishPath "TubeVault.exe"

          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "TubeVault.exe was not generated."
          }

          $forbiddenTools = @("yt-dlp.exe", "ffmpeg.exe", "ffprobe.exe")
          $includedTools = Get-ChildItem -LiteralPath $publishPath -File -Recurse |
            Where-Object { $_.Name -in $forbiddenTools }

          if ($includedTools) {
            $names = ($includedTools.Name | Sort-Object -Unique) -join ", "
            throw "The publish contains tools that must be downloaded at runtime: $names"
          }

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: TubeVault-win-x64
          path: .\artifacts\TubeVault-win-x64
          if-no-files-found: error

      - name: Build and validate MSI
        id: installer
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1

          $installerPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\installer"
          $msiFiles = @(Get-ChildItem -LiteralPath $installerPath -File -Filter "*.msi")

          if ($msiFiles.Count -ne 1) {
            $names = ($msiFiles.Name | Sort-Object) -join ", "
            throw "Expected exactly one MSI in '$installerPath'; found $($msiFiles.Count): $names"
          }

          $cabFiles = @(Get-ChildItem -LiteralPath $installerPath -File -Filter "*.cab")
          if ($cabFiles.Count -ne 0) {
            $names = ($cabFiles.Name | Sort-Object) -join ", "
            throw "External CAB files were generated: $names"
          }

          $msi = $msiFiles[0]
          if ($msi.Length -le 0) {
            throw "The generated MSI is empty: $($msi.FullName)"
          }

          $sha256 = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash
          Write-Host "MSI: $($msi.Name)"
          Write-Host "Size: $($msi.Length) bytes"
          Write-Host "SHA-256: $sha256"

          "msi_path=artifacts/installer/$($msi.Name)" >> $env:GITHUB_OUTPUT
          "artifact_name=$($msi.BaseName)-msi" >> $env:GITHUB_OUTPUT

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.installer.outputs.artifact_name }}
          path: ${{ steps.installer.outputs.msi_path }}
          if-no-files-found: error

      - name: Build portable variants
        shell: pwsh
        run: .\scripts\build-portable.ps1

      - name: Validate portable ZIPs
        id: portable
        shell: pwsh
        run: |
          $projectPath = Join-Path $env:GITHUB_WORKSPACE "src\TubeVault\TubeVault.csproj"
          [xml] $project = Get-Content -LiteralPath $projectPath -Raw
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/InformationalVersion')
          if ($null -eq $versionNode) {
            throw "TubeVault.csproj does not contain InformationalVersion."
          }

          $version = $versionNode.InnerText.Trim()
          if ($version -notmatch '^\d{4}\.\d{2}\.\d{3}$') {
            throw "InformationalVersion '$version' does not match YYYY.MM.RRR."
          }

          $portablePath = Join-Path $env:GITHUB_WORKSPACE "artifacts\portable"
          $classicName = "TubeVault-$version-win-x64-portable-classic.zip"
          $singleFileName = "TubeVault-$version-win-x64-portable-single-file.zip"
          $expectedNames = @($classicName, $singleFileName) | Sort-Object
          $zipFiles = @(Get-ChildItem -LiteralPath $portablePath -File -Filter "*.zip")
          $actualNames = @($zipFiles.Name) | Sort-Object

          if ($zipFiles.Count -ne 2 -or
              (Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames)) {
            throw "Expected exactly '$classicName' and '$singleFileName'. Found: $($actualNames -join ', ')"
          }

          foreach ($zip in $zipFiles | Sort-Object Name) {
            if ($zip.Length -le 0) {
              throw "The generated ZIP is empty: $($zip.FullName)"
            }

            $sha256 = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash
            Write-Host "ZIP: $($zip.Name)"
            Write-Host "Size: $($zip.Length) bytes"
            Write-Host "SHA-256: $sha256"
          }

          "classic_path=artifacts/portable/$classicName" >> $env:GITHUB_OUTPUT
          "classic_artifact_name=$([System.IO.Path]::GetFileNameWithoutExtension($classicName))" >> $env:GITHUB_OUTPUT
          "single_file_path=artifacts/portable/$singleFileName" >> $env:GITHUB_OUTPUT
          "single_file_artifact_name=$([System.IO.Path]::GetFileNameWithoutExtension($singleFileName))" >> $env:GITHUB_OUTPUT

      - name: Upload Portable Classic artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.portable.outputs.classic_artifact_name }}
          path: ${{ steps.portable.outputs.classic_path }}
          if-no-files-found: error

      - name: Upload Portable Single File artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.portable.outputs.single_file_artifact_name }}
          path: ${{ steps.portable.outputs.single_file_path }}
          if-no-files-found: error
